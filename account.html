<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Cara Fashion</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="header">
        <a href="index.html"><img src="img/logo.jpg" class="logo" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fas fa-shopping-bag"></i></a></li>
                <a href="#" id="close"><i class="far fa-times"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html"><i class="fas fa-shopping-bag"></i></a>
            <i id="bar" class="fas fa-bars"></i>
        </div>
    </section>

    <section id="page-header" class="about-header">
        <h2>My Account</h2>
        <p id="acct-welcome">Welcome back</p>
    </section>

    <section class="section-p1">
        <h3 style="color:#1a1a1a; margin-bottom:15px;">Order History</h3>
        <table id="cart-table">
            <thead>
                <tr><th>Order #</th><th>Date</th><th>Status</th><th>Total</th></tr>
            </thead>
            <tbody id="orders-body">
                <tr><td colspan="4">Loading...</td></tr>
            </tbody>
        </table>
    </section>

    <footer class="section-p1">
        <div class="col">
            <img class="logo" src="img/logo.jpg" alt="">
            <h4>Contact</h4>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="script.js"></script>
    <script>
        (async () => {
            const auth = await requireAuth(false, "login.html?redirect=account.html", "index.html");
            if (!auth) return;
            document.getElementById("acct-welcome").textContent =
                `Welcome back, ${auth.profile?.full_name || auth.user.email}`;

            const { data: orders, error } = await supabase
                .from("orders")
                .select("*")
                .eq("user_id", auth.user.id)
                .order("created_at", { ascending: false });

            const body = document.getElementById("orders-body");
            if (error) { body.innerHTML = `<tr><td colspan="4">Could not load orders.</td></tr>`; return; }
            if (!orders.length) { body.innerHTML = `<tr><td colspan="4">No orders yet. <a href="shop.html">Start shopping</a></td></tr>`; return; }

            body.innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>${o.status}</td>
                    <td>$${Number(o.total).toFixed(2)}</td>
                </tr>`).join("");
        })();
    </script>
</body>

</html>
