<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Cara Fashion</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <section id="header">
        <a href="../index.html"><img src="../img/logo.jpg" class="logo" alt=""></a>
        <div><ul id="navbar"><li><a href="../index.html">← Back to Site</a></li></ul></div>
    </section>

    <div class="dash-wrap">
        <nav class="dash-sidebar">
            <a href="dashboard.html">Overview</a>
            <a href="products.html">Products</a>
            <a href="orders.html">Orders</a>
            <a href="messages.html" class="active">Messages</a>
            <a href="users.html">Users</a>
        </nav>
        <main class="dash-main">
            <h2>Contact Messages</h2>
            <table class="admin-table">
                <thead>
                    <tr><th>From</th><th>Subject</th><th>Message</th><th>Date</th></tr>
                </thead>
                <tbody id="messages-body">
                    <tr><td colspan="4">Loading...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        (async () => {
            const auth = await requireAuth(true, "../login.html?redirect=admin/messages.html", "../index.html");
            if (!auth) return;

            const body = document.getElementById("messages-body");
            const { data, error } = await supabase.from("messages").select("*").order("created_at", { ascending: false });
            if (error) { body.innerHTML = `<tr><td colspan="4">${error.message}</td></tr>`; return; }
            if (!data.length) { body.innerHTML = `<tr><td colspan="4">No messages yet.</td></tr>`; return; }
            body.innerHTML = data.map(m => `
                <tr>
                    <td>${m.name}<br><small>${m.email}</small></td>
                    <td>${m.subject || "-"}</td>
                    <td>${m.message}</td>
                    <td>${new Date(m.created_at).toLocaleDateString()}</td>
                </tr>`).join("");
        })();
    </script>
</body>

</html>
