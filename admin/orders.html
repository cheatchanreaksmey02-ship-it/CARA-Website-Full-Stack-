<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Cara Fashion</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="../style.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #f6f7f9; }

        .adash-wrap { display: flex; min-height: 100vh; font-family: inherit; }

        .adash-sidebar {
            width: 240px;
            background: #fff;
            border-right: 1px solid #ececec;
            padding: 24px 16px;
            flex-shrink: 0;
        }
        .adash-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; padding: 0 8px; }
        .adash-brand img { height: 42px; width: auto; object-fit: contain; }
        .adash-brand span { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #1a1a1a; }
        .adash-nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 12px; border-radius: 10px;
            color: #606063; text-decoration: none; font-size: 14px;
            margin-bottom: 4px; transition: 0.15s ease;
        }
        .adash-nav a i { width: 18px; text-align: center; color: #a0a0a3; }
        .adash-nav a:hover { background: #f3f4f6; color: #1a1a1a; }
        .adash-nav a.active { background: #e6f2ef; color: #088178; font-weight: 600; }
        .adash-nav a.active i { color: #088178; }
        .adash-nav-logout { margin-top: 30px; padding-top: 16px; border-top: 1px solid #ececec; }

        .adash-main { flex: 1; padding: 28px 32px; min-width: 0; }

        .adash-topbar {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 22px; flex-wrap: wrap; gap: 16px;
        }
        .adash-topbar h1 { font-size: 24px; margin: 0 0 4px; color: #1a1a1a; }
        .adash-topbar p { color: #8a8a8e; margin: 0; font-size: 14px; }
        .adash-top-right { display: flex; align-items: center; gap: 18px; }
        .adash-search-box {
            display: flex; align-items: center; gap: 8px;
            background: #fff; border: 1px solid #ececec; border-radius: 10px;
            padding: 9px 14px; color: #9a9a9e; font-size: 13px; min-width: 200px;
        }
        .adash-avatar { display: flex; align-items: center; gap: 10px; }
        .adash-avatar-circle {
            width: 38px; height: 38px; border-radius: 50%;
            background: #e6f2ef; color: #088178;
            display: flex; align-items: center; justify-content: center; font-weight: 700;
        }
        .adash-avatar-text strong { display: block; font-size: 13px; color: #1a1a1a; }
        .adash-avatar-text span { font-size: 12px; color: #9a9a9e; }

        /* ---- status tabs ---- */
        .ord-tabs {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
        }
        .ord-tab {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px; border: 1px solid #ececec; border-radius: 10px;
            background: #fff; color: #606063; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.15s ease;
        }
        .ord-tab:hover { border-color: #cfe6e2; }
        .ord-tab.active { border-color: #088178; color: #088178; background: #f4faf9; }
        .ord-tab-count {
            background: #f0f0f0; color: #606063; border-radius: 20px;
            padding: 2px 8px; font-size: 11px;
        }
        .ord-tab.active .ord-tab-count { background: #088178; color: #fff; }

        /* ---- filter row ---- */
        .ord-filters {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            background: #fff; border: 1px solid #ececec; border-radius: 14px;
            padding: 14px; margin-bottom: 18px;
        }
        .ord-filters input[type="text"], .ord-filters select {
            border: 1px solid #ececec; border-radius: 8px; padding: 9px 12px;
            font-size: 13px; color: #1a1a1a; background: #fff;
        }
        .ord-search-input { flex: 1; min-width: 220px; }
        .ord-btn {
            display: flex; align-items: center; gap: 8px;
            border: 1px solid #ececec; border-radius: 8px; padding: 9px 16px;
            font-size: 13px; font-weight: 600; cursor: pointer; background: #fff; color: #1a1a1a;
        }
        .ord-btn:hover { border-color: #088178; color: #088178; }

        /* ---- table ---- */
        .ord-panel { background: #fff; border: 1px solid #ececec; border-radius: 16px; overflow: hidden; }
        table.ord-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        table.ord-table th {
            text-align: left; padding: 12px 14px; color: #9a9a9e;
            font-weight: 600; border-bottom: 1px solid #ececec; font-size: 12px;
            background: #fafafa;
        }
        table.ord-table td { padding: 14px; border-bottom: 1px solid #f4f4f4; color: #1a1a1a; vertical-align: middle; }
        .ord-cust-name { font-weight: 600; color: #1a1a1a; }
        .ord-cust-email { font-size: 12px; color: #9a9a9e; }
        .ord-status-badge {
            padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
            display: inline-block; text-transform: capitalize;
        }
        .ord-status-select {
            border: 1px solid #ececec; border-radius: 8px; padding: 6px 8px; font-size: 12px;
        }
        .ord-pay-pill {
            display: inline-block; padding: 3px 9px; border-radius: 20px;
            background: #eef5f4; color: #088178; font-size: 11px; font-weight: 700; margin-top: 3px;
        }
        .ord-view-btn {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid #ececec;
            background: #fff; color: #606063; cursor: pointer;
        }
        .ord-view-btn:hover { border-color: #088178; color: #088178; }

        .ord-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; font-size: 13px; color: #8a8a8e; flex-wrap: wrap; gap: 10px;
        }
        .ord-page-btns { display: flex; gap: 6px; align-items: center; }
        .ord-page-btn {
            width: 30px; height: 30px; border-radius: 8px; border: 1px solid #ececec;
            background: #fff; color: #606063; cursor: pointer; font-size: 13px;
        }
        .ord-page-btn.active { border-color: #088178; color: #088178; background: #f4faf9; font-weight: 700; }
        .ord-page-btn:disabled { opacity: 0.4; cursor: default; }

        @media (max-width: 900px) {
            .adash-wrap { flex-direction: column; }
            .adash-sidebar {
                width: 100%; display: flex; align-items: center; gap: 4px;
                overflow-x: auto; padding: 10px 12px; border-right: none;
                border-bottom: 1px solid #ececec; -webkit-overflow-scrolling: touch;
            }
            .adash-brand { margin-bottom: 0; padding: 0 10px 0 0; flex-shrink: 0; }
            .adash-brand img { width: 84px; }
            .adash-nav { display: flex; gap: 2px; }
            .adash-nav a { white-space: nowrap; margin-bottom: 0; padding: 8px 10px; font-size: 13px; }
            .adash-nav-logout {
                margin-top: 0; padding-top: 0; border-top: none;
                display: flex; gap: 4px; flex-shrink: 0; margin-left: 8px;
            }
            .adash-nav-logout a { white-space: nowrap; padding: 8px 10px; font-size: 13px; }
            .adash-main { padding: 18px 16px; }
        }
        @media (max-width: 700px) {
            .adash-topbar { flex-direction: column; align-items: stretch; }
            .adash-search-box { display: none; }
            .ord-filters { flex-direction: column; align-items: stretch; }
            .ord-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
            .ord-tab { white-space: nowrap; }
        }
        @media (max-width: 480px) {
            .adash-topbar h1 { font-size: 22px; }
            .adash-avatar-text { display: none; }
            .ord-tab { padding: 8px 12px; font-size: 12px; }
            .ord-filters { padding: 12px; }
        }
        .ord-table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        @media (max-width: 600px) {
            .ord-table-scroll { overflow-x: visible; }
            table.ord-table, table.ord-table thead, table.ord-table tbody,
            table.ord-table th, table.ord-table td, table.ord-table tr { display: block; }
            table.ord-table thead { display: none; }
            table.ord-table tr {
                border: 1px solid #ececec; border-radius: 12px;
                margin: 0 0 12px; padding: 10px 12px; background: #fff;
            }
            table.ord-table td {
                border-bottom: none; padding: 7px 0;
                display: flex; justify-content: space-between; align-items: center;
                gap: 10px; text-align: right;
            }
            table.ord-table td::before {
                content: attr(data-label);
                font-weight: 600; color: #9a9a9e; font-size: 11px;
                text-align: left; flex-shrink: 0;
            }
            table.ord-table td[data-label="Customer"] { flex-direction: column; align-items: flex-start; text-align: left; }
            table.ord-table td[data-label="Customer"]::before { margin-bottom: 4px; }
        }
    </style>
</head>

<body>

    <div class="adash-wrap">
        <nav class="adash-sidebar">
            <div class="adash-brand">
                <img src="../img/logo.jpg" alt="Cara">
            </div>
            <div class="adash-nav">
                <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html" class="active"><i class="fas fa-shopping-bag"></i> Orders</a>
                <a href="users.html"><i class="fas fa-users"></i> Users</a>
                <a href="messages.html"><i class="fas fa-envelope"></i> Messages</a>
            </div>

            <div class="adash-nav-logout">
                <a href="../html/index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
                <a href="#" id="adash-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        
        </nav>

        <main class="adash-main">
            <div class="adash-topbar">
                <div>
                    <h1>Manage Orders</h1>
                    <p>View and manage all customer orders.</p>
                </div>
                <div class="adash-top-right">
                    <div class="adash-search-box"><i class="fas fa-search"></i> Search...</div>
                    <div class="adash-avatar">
                        <div class="adash-avatar-circle" id="ord-avatar-letter">A</div>
                        <div class="adash-avatar-text">
                            <strong id="ord-admin-name">Admin</strong>
                            <span>Admin</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="ord-tabs" id="ord-tabs">
                <div class="ord-tab active" data-status="all">All Orders <span class="ord-tab-count" id="count-all">0</span></div>
                <div class="ord-tab" data-status="pending">Pending <span class="ord-tab-count" id="count-pending">0</span></div>
                <div class="ord-tab" data-status="paid">Paid <span class="ord-tab-count" id="count-paid">0</span></div>
                <div class="ord-tab" data-status="shipped">Shipped <span class="ord-tab-count" id="count-shipped">0</span></div>
                <div class="ord-tab" data-status="completed">Completed <span class="ord-tab-count" id="count-completed">0</span></div>
                <div class="ord-tab" data-status="cancelled">Cancelled <span class="ord-tab-count" id="count-cancelled">0</span></div>
            </div>

            <div class="ord-filters">
                <input type="text" id="ord-search" class="ord-search-input" placeholder="Search by order ID, customer, email...">
                <select id="ord-payment-filter">
                    <option value="">All Payment</option>
                    <option value="cod">Cash on Delivery</option>
                    <option value="bank">Bank Transfer</option>
                </select>
                <button type="button" class="ord-btn" id="ord-export"><i class="fas fa-download"></i> Export</button>
            </div>

            <div class="ord-panel">
                <div class="ord-table-scroll">
                <table class="ord-table">
                    <thead>
                        <tr>
                            <th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th>
                            <th>Payment</th><th>Status</th><th>Items</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-body">
                        <tr><td colspan="8">Loading...</td></tr>
                    </tbody>
                </table>
                </div>
                <div class="ord-footer">
                    <span id="ord-showing"></span>
                    <div class="ord-page-btns" id="ord-pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const STATUSES = ["pending", "paid", "shipped", "completed", "cancelled"];
        const PAGE_SIZE = 10;
        let allOrders = [];
        let itemCounts = {};
        let currentStatus = "all";
        let currentPage = 1;

        function statusColor(status) {
            const s = (status || "").toLowerCase();
            if (s === "completed") return { bg: "#e6f7ec", color: "#16a34a" };
            if (s === "shipped") return { bg: "#eaf1fb", color: "#2563eb" };
            if (s === "paid" || s === "processing") return { bg: "#fdf0e2", color: "#d97706" };
            if (s === "cancelled") return { bg: "#fde8e8", color: "#e63946" };
            return { bg: "#f0f0f0", color: "#606063" };
        }

        async function updateStatus(id, status) {
            const { error } = await supabaseClient.from("orders").update({ status }).eq("id", id);
            if (error) { alert(error.message); return; }
            const o = allOrders.find(x => x.id === id);
            if (o) o.status = status;
            renderCounts();
            renderTable();
        }

        function renderCounts() {
            document.getElementById("count-all").textContent = allOrders.length;
            STATUSES.forEach(s => {
                document.getElementById(`count-${s}`).textContent = allOrders.filter(o => o.status === s).length;
            });
        }

        function getFiltered() {
            const term = document.getElementById("ord-search").value.trim().toLowerCase();
            const payment = document.getElementById("ord-payment-filter").value;
            return allOrders.filter(o => {
                if (currentStatus !== "all" && o.status !== currentStatus) return false;
                if (payment && o.payment_method !== payment) return false;
                if (term) {
                    const hay = `#ord-${o.id} ${o.customer_name || ""} ${o.email || ""}`.toLowerCase();
                    if (!hay.includes(term)) return false;
                }
                return true;
            });
        }

        function renderTable() {
            const filtered = getFiltered();
            const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
            if (currentPage > totalPages) currentPage = totalPages;
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = filtered.slice(start, start + PAGE_SIZE);

            const body = document.getElementById("orders-body");
            if (!pageItems.length) {
                body.innerHTML = `<tr><td colspan="8">No orders found.</td></tr>`;
            } else {
                body.innerHTML = pageItems.map(o => {
                    const c = statusColor(o.status);
                    const paymentLabel = o.payment_method === "bank" ? "Bank Transfer" : "Cash on Delivery";
                    const items = itemCounts[o.id] || 0;
                    return `
                    <tr>
                        <td data-label="Order ID">#ORD-${o.id}</td>
                        <td data-label="Customer">
                            <div class="ord-cust-name">${o.customer_name || "Guest"}</div>
                            <div class="ord-cust-email">${o.email || ""}</div>
                        </td>
                        <td data-label="Date">${new Date(o.created_at).toLocaleDateString()}<br><span style="color:#9a9a9e; font-size:11px;">${new Date(o.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span></td>
                        <td data-label="Total">$${Number(o.total).toFixed(2)}</td>
                        <td data-label="Payment"><span class="ord-pay-pill">${paymentLabel}</span></td>
                        <td data-label="Status">
                            <select class="ord-status-select" style="background:${c.bg}; color:${c.color};" onchange="updateStatus(${o.id}, this.value)">
                                ${STATUSES.map(s => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
                            </select>
                        </td>
                        <td data-label="Items">${items} item${items === 1 ? "" : "s"}</td>
                        <td data-label="Actions"><button type="button" class="ord-view-btn" title="View items" onclick="viewOrder(${o.id})"><i class="fas fa-eye"></i></button></td>
                    </tr>`;
                }).join("");
            }

            document.getElementById("ord-showing").textContent =
                filtered.length ? `Showing ${start + 1} to ${Math.min(start + PAGE_SIZE, filtered.length)} of ${filtered.length} orders` : "No orders";

            const pag = document.getElementById("ord-pagination");
            let btns = `<button class="ord-page-btn" ${currentPage === 1 ? "disabled" : ""} onclick="goPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
            for (let p = 1; p <= totalPages; p++) {
                if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) {
                    btns += `<button class="ord-page-btn ${p === currentPage ? "active" : ""}" onclick="goPage(${p})">${p}</button>`;
                } else if (Math.abs(p - currentPage) === 2) {
                    btns += `<span style="padding:0 4px;">…</span>`;
                }
            }
            btns += `<button class="ord-page-btn" ${currentPage === totalPages ? "disabled" : ""} onclick="goPage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
            pag.innerHTML = btns;
        }

        function goPage(p) {
            currentPage = p;
            renderTable();
        }

        function viewOrder(id) {
            const o = allOrders.find(x => x.id === id);
            if (!o) return;
            alert(`Order #ORD-${o.id}\nCustomer: ${o.customer_name || "Guest"} (${o.email || "no email"})\nAddress: ${o.address || "-"}, ${o.province || "-"}\nPhone: ${o.phone || "-"}\nNote: ${o.note || "-"}\nTotal: $${Number(o.total).toFixed(2)}`);
        }

        function exportCSV() {
            const rows = getFiltered();
            const header = ["Order ID", "Customer", "Email", "Date", "Total", "Payment", "Status"];
            const lines = rows.map(o => [
                `ORD-${o.id}`, o.customer_name || "", o.email || "",
                new Date(o.created_at).toLocaleDateString(), Number(o.total).toFixed(2),
                o.payment_method || "", o.status
            ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
            const csv = [header.join(","), ...lines].join("\n");
            const blob = new Blob([csv], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "orders.csv";
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById("ord-tabs").addEventListener("click", (e) => {
            const tab = e.target.closest(".ord-tab");
            if (!tab) return;
            document.querySelectorAll(".ord-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            currentStatus = tab.dataset.status;
            currentPage = 1;
            renderTable();
        });
        document.getElementById("ord-search").addEventListener("input", () => { currentPage = 1; renderTable(); });
        document.getElementById("ord-payment-filter").addEventListener("change", () => { currentPage = 1; renderTable(); });
        document.getElementById("ord-export").addEventListener("click", exportCSV);

        async function loadOrders() {
            const { data, error } = await supabaseClient
                .from("orders")
                .select("*")
                .order("created_at", { ascending: false });
            if (error) {
                document.getElementById("orders-body").innerHTML = `<tr><td colspan="8">${error.message}</td></tr>`;
                return;
            }
            allOrders = data || [];

            const { data: items } = await supabaseClient.from("order_items").select("order_id, quantity");
            itemCounts = {};
            (items || []).forEach(it => {
                itemCounts[it.order_id] = (itemCounts[it.order_id] || 0) + it.quantity;
            });

            renderCounts();
            renderTable();
        }

        (async () => {
            const auth = await requireAuth(true, "../html/login.html?redirect=admin/orders.html", "../html/index.html");
            if (!auth) return;

            const adminName = auth.profile?.full_name || auth.user.email;
            document.getElementById("ord-admin-name").textContent = adminName;
            document.getElementById("ord-avatar-letter").textContent = adminName.charAt(0).toUpperCase();
            document.getElementById("adash-logout").addEventListener("click", (e) => { e.preventDefault(); logoutUser(); });
            loadOrders();
        })();
    </script>
</body>

</html>
