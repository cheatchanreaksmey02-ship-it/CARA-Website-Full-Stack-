<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Cara Fashion</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <section id="header">
        <a href="../index.html"><img src="../img/logo.jpg" class="logo" alt=""></a>
        <div>
            <ul id="navbar"><li><a href="../index.html">← Back to Site</a></li></ul>
        </div>
    </section>

    <div class="dash-wrap">
        <nav class="dash-sidebar">
            <a href="dashboard.html">Overview</a>
            <a href="products.html">Products</a>
            <a href="orders.html" class="active">Orders</a>
            <a href="messages.html">Messages</a>
            <a href="users.html">Users</a>
        </nav>
        <main class="dash-main">
            <h2>Manage Orders</h2>
            <table class="admin-table">
                <thead>
                    <tr><th>Order #</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr>
                </thead>
                <tbody id="orders-body">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const STATUSES = ["pending", "paid", "shipped", "completed", "cancelled"];

        async function updateStatus(id, status) {
            const { error } = await supabase.from("orders").update({ status }).eq("id", id);
            if (error) alert(error.message);
        }

        async function loadOrders() {
            const body = document.getElementById("orders-body");
            const { data, error } = await supabase
                .from("orders")
                .select("*, profiles(full_name)")
                .order("created_at", { ascending: false });
            if (error) { body.innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`; return; }
            if (!data.length) { body.innerHTML = `<tr><td colspan="5">No orders yet.</td></tr>`; return; }
            body.innerHTML = data.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>${o.profiles?.full_name || o.user_id || "Guest"}</td>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>$${Number(o.total).toFixed(2)}</td>
                    <td>
                        <select onchange="updateStatus(${o.id}, this.value)">
                            ${STATUSES.map(s => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
                        </select>
                    </td>
                </tr>`).join("");
        }

        (async () => {
            const auth = await requireAuth(true, "../login.html?redirect=admin/orders.html", "../index.html");
            if (!auth) return;
            loadOrders();
        })();
    </script>
</body>

</html>
