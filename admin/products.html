<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Cara Fashion</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <section id="header">
        <a href="../index.html"><img src="../img/logo.jpg" class="logo" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a href="../index.html">← Back to Site</a></li>
            </ul>
        </div>
    </section>

    <div class="dash-wrap">
        <nav class="dash-sidebar">
            <a href="dashboard.html">Overview</a>
            <a href="products.html" class="active">Products</a>
            <a href="orders.html">Orders</a>
            <a href="messages.html">Messages</a>
            <a href="users.html">Users</a>
        </nav>
        <main class="dash-main">
            <h2>Manage Products</h2>

            <form class="admin-form" id="product-form">
                <input type="hidden" id="product-id">
                <input type="text" id="p-name" placeholder="Product name" required>
                <input type="text" id="p-brand" placeholder="Brand">
                <input type="number" id="p-price" placeholder="Price" step="0.01" min="0" required>
                <input type="number" id="p-rating" placeholder="Rating (1-5)" step="0.5" min="1" max="5" value="5">
                <input type="text" id="p-image" placeholder="Image path e.g. img/product/f1.jpg">
                <select id="p-category"></select>
                <input type="number" id="p-stock" placeholder="Stock quantity" min="0" value="0">
                <textarea id="p-description" placeholder="Description" rows="3"></textarea>
                <button type="submit" class="btn-primary">Save Product</button>
                <button type="button" class="btn-primary" style="background:#606063;" id="cancel-edit">Cancel</button>
            </form>
            <p id="product-msg"></p>

            <table class="admin-table">
                <thead>
                    <tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
                </thead>
                <tbody id="products-body">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        let categories = [];

        async function loadCategories() {
            const { data } = await supabase.from("categories").select("*").order("id");
            categories = data || [];
            document.getElementById("p-category").innerHTML =
                categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
        }

        async function loadAdminProducts() {
            const body = document.getElementById("products-body");
            const { data, error } = await supabase.from("products").select("*").order("created_at", { ascending: false });
            if (error) { body.innerHTML = `<tr><td colspan="5">${error.message}</td></tr>`; return; }
            if (!data.length) { body.innerHTML = `<tr><td colspan="5">No products yet.</td></tr>`; return; }
            body.innerHTML = data.map(p => `
                <tr>
                    <td><img src="../${p.image_url || 'img/product/f1.jpg'}" style="width:50px;height:50px;object-fit:cover;border-radius:6px;"></td>
                    <td>${p.name}</td>
                    <td>$${Number(p.price).toFixed(2)}</td>
                    <td>${p.stock}</td>
                    <td>
                        <a href="#" onclick="editProduct(${p.id});return false;">Edit</a> |
                        <a href="#" class="btn-danger" onclick="deleteProduct(${p.id});return false;">Delete</a>
                    </td>
                </tr>`).join("");
            window.__products = data;
        }

        function editProduct(id) {
            const p = window.__products.find(x => x.id === id);
            if (!p) return;
            document.getElementById("product-id").value = p.id;
            document.getElementById("p-name").value = p.name;
            document.getElementById("p-brand").value = p.brand || "";
            document.getElementById("p-price").value = p.price;
            document.getElementById("p-rating").value = p.rating || 5;
            document.getElementById("p-image").value = p.image_url || "";
            document.getElementById("p-category").value = p.category_id || "";
            document.getElementById("p-stock").value = p.stock;
            document.getElementById("p-description").value = p.description || "";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function deleteProduct(id) {
            if (!confirm("Delete this product? This cannot be undone.")) return;
            const { error } = await supabase.from("products").delete().eq("id", id);
            if (error) { alert(error.message); return; }
            loadAdminProducts();
        }

        document.getElementById("cancel-edit").addEventListener("click", () => {
            document.getElementById("product-form").reset();
            document.getElementById("product-id").value = "";
        });

        document.getElementById("product-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("product-msg");
            const id = document.getElementById("product-id").value;
            const payload = {
                name: document.getElementById("p-name").value.trim(),
                brand: document.getElementById("p-brand").value.trim(),
                price: parseFloat(document.getElementById("p-price").value),
                rating: parseFloat(document.getElementById("p-rating").value) || 5,
                image_url: document.getElementById("p-image").value.trim(),
                category_id: document.getElementById("p-category").value || null,
                stock: parseInt(document.getElementById("p-stock").value) || 0,
                description: document.getElementById("p-description").value.trim()
            };

            msg.style.color = "#088178";
            msg.textContent = "Saving...";
            const { error } = id
                ? await supabase.from("products").update(payload).eq("id", id)
                : await supabase.from("products").insert(payload);

            if (error) { msg.style.color = "#e63946"; msg.textContent = error.message; return; }
            msg.textContent = "Saved!";
            document.getElementById("product-form").reset();
            document.getElementById("product-id").value = "";
            loadAdminProducts();
        });

        (async () => {
            const auth = await requireAuth(true, "../login.html?redirect=admin/products.html", "../index.html");
            if (!auth) return;
            await loadCategories();
            await loadAdminProducts();
        })();
    </script>
</body>

</html>
