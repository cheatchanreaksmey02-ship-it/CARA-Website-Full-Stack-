<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cara Fashion</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <section id="header">
        <a href="index.html"><img src="../img/logo.jpg" class="logo" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fas fa-shopping-bag"></i></a></li>
                <a href="#" id="close"><i class="far fa-times"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html"><i class="fas fa-shopping-bag"></i></a>
            <i id="bar" class="fas fa-bars"></i>
        </div>
    </section>

    <section id="page-header" class="about-header">
        <h2>Welcome Back</h2>
        <p>Login to your account</p>
    </section>

    <section id="form-details">
        <form id="login-form">
            <span>SIGN IN</span>
            <h2>Login to Cara Fashion</h2>
            <p id="form-msg" style="color:#e63946; min-height:20px;"></p>
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="normal">Login</button>
            <p style="margin-top:15px;">
                <a href="forgot-password.html">Forgot your password?</a>
            </p>
            <p>Don't have an account? <a href="register.html">Register here</a></p>
        </form>
    </section>

    <footer class="section-p1">
        <div class="col">
            <img class="logo" src="../img/logo.jpg" alt="">
            <h4>Contact</h4>
            <p><strong>Address:</strong>No.562, Street 32, Boeung Keng Kang, Phnom Penh</p>
            <p><strong>Phone:</strong> +85 12 345 678</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/script.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get("redirect");

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("form-msg");
            msg.style.color = "#e63946";
            msg.textContent = "Signing in...";
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const { error } = await loginUser(email, password);
            if (error) {
                msg.textContent = error.message;
                return;
            }
            window.location.href = redirect || "index.html";
        });
    </script>
</body>

</html>
