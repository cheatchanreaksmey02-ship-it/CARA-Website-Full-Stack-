<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Cara Fashion</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <section id="header">
        <a href="index.html"><img src="../img/logo.jpg" class="logo" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fas fa-shopping-bag"></i></a></li>
                <a href="#" id="close"><i class="far fa-times"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html"><i class="fas fa-shopping-bag"></i></a>
            <i id="bar" class="fas fa-bars"></i>
        </div>
    </section>

    <section id="page-header" class="about-header">
        <h2>Reset Password</h2>
        <p>Choose a new password</p>
    </section>

    <section id="form-details">
        <form id="reset-form">
            <span>RESET</span>
            <h2>Set a New Password</h2>
            <p id="form-msg" style="color:#e63946; min-height:20px;"></p>
            <input type="password" id="password" placeholder="New Password (min 6 characters)" required minlength="6">
            <input type="password" id="confirm-password" placeholder="Confirm New Password" required minlength="6">
            <button type="submit" class="normal">Update Password</button>
        </form>
    </section>

    <footer class="section-p1">
        <div class="col">
            <img class="logo" src="../img/logo.jpg" alt="">
            <h4>Contact</h4>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/script.js"></script>
    <script>
        // Supabase redirects here with a recovery token in the URL hash;
        // supabase-js automatically picks it up and creates a temporary session.
        document.getElementById("reset-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const msg = document.getElementById("form-msg");
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirm-password").value;
            if (password !== confirm) {
                msg.textContent = "Passwords do not match.";
                return;
            }
            msg.style.color = "#088178";
            msg.textContent = "Updating...";
            const { error } = await updatePassword(password);
            if (error) {
                msg.style.color = "#e63946";
                msg.textContent = error.message;
                return;
            }
            msg.textContent = "Password updated! Redirecting to login...";
            setTimeout(() => window.location.href = "login.html", 1500);
        });
    </script>
</body>
</html>
